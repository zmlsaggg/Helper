name: IWYU

on: workflow_dispatch

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Install LLVM 18 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev cmake
    - name: Build include-what-you-use
      run: |
        git clone --depth=1 --single-branch --branch clang_18 https://github.com/include-what-you-use/include-what-you-use.git
        cd include-what-you-use
        cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-18 -B build
        cmake --build build --parallel
    - name: Configure
      env:
        CXX: clang++-18
      run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE="$PWD/include-what-you-use/build/bin/include-what-you-use;-Xiwyu;--no_fwd_decls;-Xiwyu;--check_also=$PWD/Source/**/*.h" -B build
    - name: Run include-what-you-use
      run: cmake --build build --parallel
