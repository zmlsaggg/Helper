name: clang-tidy

on: [push, pull_request]

jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: Install clang tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 clang-tools-18
    - name: Configure
      env:
        CXX: clang++-18
      run: cmake -Werror=dev -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_EXPORT_COMPILE_COMMANDS=1 -B build
    - name: Run clang-tidy
      run: run-clang-tidy-18 Source/ -p build/
