name: Linux

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++-18]
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v7

    - name: Install compiler
      if: matrix.compiler == 'clang++-18'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18

    - name: Configure
      env:
        CXX: ${{ matrix.compiler }}
      run: cmake -Werror=dev -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DENABLE_TESTS="unit;functional" -DCMAKE_COMPILE_WARNING_AS_ERROR=1 -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=4 -B build

    - name: Build source
      run: cmake --build build --target Osiris --parallel

    - name: Build unit tests
      run: cmake --build build --target UnitTests --parallel

    - name: Build functional tests
      run: cmake --build build --target FunctionalTests --parallel

    - name: Run unit tests
      run: ctest -R ^Unit --test-dir build --output-on-failure --no-tests=error --schedule-random --parallel

    - name: Run functional tests
      run: ctest -R ^Functional --test-dir build --output-on-failure --no-tests=error --schedule-random --parallel
